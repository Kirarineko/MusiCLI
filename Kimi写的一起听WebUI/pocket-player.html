<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MusiCLI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MusiCLI · Pocket Player</title>
<style>
/* ═══════════════ 暗色极简 · 设计变量 ═══════════════ */
:root {
  --bg: #09090c;
  --bg2: #111116;
  --bg3: #1a1a21;
  --line: rgba(255, 255, 255, .10);
  --line2: rgba(255, 255, 255, .055);
  --ink: #f3f3f5;
  --ink2: rgba(243, 243, 245, .55);
  --ink3: rgba(243, 243, 245, .30);
  --danger: #e5534b;
  --tab-h: calc(58px + env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #000;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
input { font-family: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
svg { display: block; }
::-webkit-scrollbar { width: 0; height: 0; }

#wrap {
  position: fixed; inset: 0;
  max-width: 560px; margin: 0 auto;
  background: var(--bg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
@media (min-width: 600px) {
  #wrap { border-left: 1px solid var(--line2); border-right: 1px solid var(--line2); }
}

/* ═══════════════ 顶栏 ═══════════════ */
header {
  flex: none; height: 52px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line2);
}
#brand {
  font-size: 12px; font-weight: 700; letter-spacing: .32em;
  color: var(--ink); white-space: nowrap;
}
#brand em { font-style: normal; color: var(--ink3); font-weight: 400; }
#conn {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: flex-end; gap: 7px;
  font-size: 11px; color: var(--ink3);
  overflow: hidden;
}
#conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); flex: none; transition: background .3s; }
#conn.ok .dot { background: #4ade80; }
#conn.bad .dot { background: var(--danger); }
#conn .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icbtn {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  color: var(--ink2); border-radius: 10px;
  transition: color .2s, background .2s;
}
.icbtn:active { color: var(--ink); background: var(--line2); }

/* ═══════════════ 视图容器 ═══════════════ */
main { flex: 1; position: relative; min-height: 0; }
.view {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  min-height: 0;
}
.view.on { display: flex; }

/* ═══════════════ 播放视图 ═══════════════ */
#view-player { padding: 0 22px; }
.np-head { flex: none; padding: 18px 0 4px; min-width: 0; }
#np-title {
  font-size: 18px; font-weight: 700; letter-spacing: .02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#np-sub {
  margin-top: 5px; font-size: 12.5px; color: var(--ink2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#np-tags { display: flex; gap: 6px; margin-top: 9px; min-height: 18px; flex-wrap: wrap; }
.ntag {
  font-size: 10px; letter-spacing: .08em; color: var(--ink3);
  border: 1px solid var(--line2); border-radius: 999px; padding: 2px 8px;
}
.stage { flex: 1; position: relative; min-height: 0; display: grid; place-items: center; }

/* 唱片 */
#disc {
  width: min(56vw, 230px); aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: repeating-radial-gradient(circle, #101015 0 2px, #0b0b0f 2px 4px);
  display: grid; place-items: center;
  animation: spin 22s linear infinite;
  animation-play-state: paused;
  position: relative;
  transition: transform .35s ease;
}
#disc.playing { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
#disc::after {
  content: ""; position: absolute; inset: -1px; border-radius: 50%;
  box-shadow: 0 0 0 10px rgba(255,255,255,.014), 0 18px 50px rgba(0,0,0,.55);
  pointer-events: none;
}
.disc-label {
  width: 34%; aspect-ratio: 1; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink3);
}
.disc-hole { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line2); }
.stage .hint {
  position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  font-size: 10.5px; letter-spacing: .18em; color: var(--ink3); white-space: nowrap;
}

/* 歌词覆盖层 */
#lyrics {
  position: absolute; inset: 0; z-index: 3;
  background: rgba(9, 9, 12, .9);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 34px 10px 24px;
  text-align: center;
  display: none;
  -webkit-overflow-scrolling: touch;
}
#lyrics.on { display: block; }
#lyr-close {
  position: absolute; top: 6px; right: 0; z-index: 4;
  width: 34px; height: 34px; display: none;
  place-items: center; color: var(--ink3);
}
#lyrics.on ~ #lyr-close { display: grid; }
.ll {
  padding: 7px 6px; font-size: 14px; line-height: 1.55;
  color: var(--ink3); cursor: pointer;
  transition: color .25s, font-size .25s;
  overflow-wrap: anywhere;
}
.ll.cur { color: var(--ink); font-size: 16px; font-weight: 600; }
.lyr-empty { padding-top: 30%; color: var(--ink3); font-size: 13px; letter-spacing: .1em; }

/* 进度条 */
.seek-wrap { flex: none; padding: 10px 0 2px; }
#seek {
  position: relative; height: 28px; touch-action: none; cursor: pointer;
}
#seek .track {
  position: absolute; left: 0; right: 0; top: 50%; height: 3px;
  transform: translateY(-50%);
  background: var(--line2); border-radius: 2px; overflow: hidden;
}
#seek .buf, #seek .fill {
  position: absolute; inset: 0;
  transform-origin: left center; transform: scaleX(0);
}
#seek .buf { background: rgba(255,255,255,.13); }
#seek .fill { background: var(--ink); }
#seek .knob {
  position: absolute; top: 50%; left: 0;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink);
  transform: translate(-50%, -50%);
  box-shadow: 0 1px 6px rgba(0,0,0,.5);
  pointer-events: none;
}
.times { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* 控制区 */
.controls {
  flex: none;
  display: flex; align-items: center; justify-content: center; gap: clamp(14px, 6vw, 30px);
  padding: 12px 0 4px;
}
.cbtn { color: var(--ink2); width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; position: relative; transition: color .2s; }
.cbtn:active { color: var(--ink); }
.cbtn.active { color: var(--ink); }
.cbtn .badge {
  position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap;
}
#btn-play {
  width: 62px; height: 62px; border-radius: 50%;
  background: var(--ink); color: var(--bg);
  display: grid; place-items: center;
  transition: transform .15s ease, opacity .2s;
}
#btn-play:active { transform: scale(.93); }
#btn-play.loading { opacity: .55; }

/* 音量 */
.vol-row { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 2px 14px; color: var(--ink3); }
body.ios .vol-row { display: none; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 28px; background: transparent; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px;
  background: linear-gradient(to right, var(--ink) 0 var(--fill, 80%), var(--line2) var(--fill, 80%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink); margin-top: -4.5px;
}
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line2); }
input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--ink); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: var(--ink); }

/* ═══════════════ 列表视图（曲库/歌单/队列） ═══════════════ */
.bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
.bar .ttl { font-size: 13px; font-weight: 600; letter-spacing: .12em; }
.bar .cnt { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.bar .sp { flex: 1; }
.search-in {
  flex: 1; min-width: 0;
  font-size: 13.5px; padding: 9px 14px;
  border: 1px solid var(--line2); border-radius: 999px; outline: none;
  background: var(--bg2); color: var(--ink);
  transition: border-color .25s;
}
.search-in:focus { border-color: var(--line); }
.search-in::placeholder { color: var(--ink3); }
.chipbtn {
  flex: none; font-size: 11.5px; color: var(--ink2);
  border: 1px solid var(--line2); border-radius: 999px;
  padding: 6px 13px; transition: all .2s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.chipbtn:active { color: var(--ink); border-color: var(--line); background: var(--line2); }
.chipbtn.danger:active { color: var(--danger); border-color: var(--danger); }
.list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 14px 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.tr {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto;
  align-items: center; gap: 10px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line2);
  cursor: pointer;
  border-radius: 6px;
}
.tr:active { background: var(--line2); }
.tr .idx { text-align: right; font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.tr .meta { min-width: 0; }
.tr .t1 { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .t2 { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr.cur .t1 { font-weight: 700; }
.tr .dur { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.tr .mini {
  width: 32px; height: 32px; display: grid; place-items: center;
  color: var(--ink3); border-radius: 50%;
}
.tr .mini:active { color: var(--ink); background: var(--line); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 2.5px; background: var(--ink); border-radius: 1px; animation: eqb 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: .25s; }
.eq i:nth-child(3) { animation-delay: .5s; }
@keyframes eqb { 0%, 100% { height: 4px; } 50% { height: 12px; } }
.eq.paused i { animation-play-state: paused; height: 4px; }

.empty {
  padding: 60px 24px; text-align: center;
  color: var(--ink3); font-size: 13px; line-height: 2;
}
.empty .big { display: block; font-size: 34px; margin-bottom: 12px; opacity: .5; }

/* 歌单卡片 */
.pl {
  border: 1px solid var(--line2); border-radius: 14px;
  padding: 13px 15px; margin-bottom: 10px;
  background: var(--bg2);
}
.pl .nm { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.pl .nm .cnt { font-size: 11px; color: var(--ink3); font-weight: 400; }
.pl .ds { margin-top: 4px; font-size: 11.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .ops { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }

/* ═══════════════ 迷你播放条 ═══════════════ */
#mini {
  flex: none; height: 56px;
  display: none; align-items: center; gap: 12px;
  padding: 0 16px;
  border-top: 1px solid var(--line2);
  background: var(--bg2);
  position: relative; cursor: pointer;
}
#mini.on { display: flex; }
#mini .mprog { position: absolute; top: -1px; left: 0; right: 0; height: 2px; background: var(--line2); }
#mini .mfill { height: 100%; background: var(--ink); width: 0%; }
#mini .mdisc {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line);
  background: repeating-radial-gradient(circle, #14141a 0 2px, #0d0d11 2px 4px);
  display: grid; place-items: center; color: var(--ink3);
  animation: spin 14s linear infinite; animation-play-state: paused;
}
#mini.playing .mdisc { animation-play-state: running; }
#mini .mm { flex: 1; min-width: 0; }
#mini .mt { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mini .ms { margin-top: 1px; font-size: 10.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mini .mbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); }

/* ═══════════════ 底部导航 ═══════════════ */
nav {
  flex: none; height: var(--tab-h);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line2);
  background: var(--bg);
}
.tabbtn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--ink3); font-size: 10px; letter-spacing: .14em;
  transition: color .2s;
}
.tabbtn.on { color: var(--ink); }

/* ═══════════════ 弹窗 / 提示 ═══════════════ */
#mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .65);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: none; place-items: center;
  padding: 24px;
}
#mask.show { display: grid; }
.card {
  width: 100%; max-width: 400px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 18px; padding: 20px;
}
.card h3 { font-size: 15px; font-weight: 700; letter-spacing: .06em; margin-bottom: 16px; }
.f-field { margin-bottom: 13px; }
.f-field label { display: block; font-size: 11.5px; color: var(--ink3); margin-bottom: 6px; letter-spacing: .06em; }
.f-field input {
  width: 100%; font-size: 14px; padding: 10px 13px;
  border: 1px solid var(--line2); border-radius: 10px; outline: none;
  background: var(--bg); color: var(--ink);
}
.f-field input:focus { border-color: var(--line); }
#m-err { min-height: 16px; font-size: 12px; color: var(--danger); margin: 4px 0 10px; }
.card .ops { display: flex; justify-content: flex-end; gap: 10px; }
.btn {
  font-size: 13px; padding: 9px 20px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink2);
  transition: all .2s;
}
.btn:active { color: var(--ink); background: var(--line2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }

#toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 76px);
  transform: translateX(-50%) translateY(10px);
  z-index: 70;
  background: var(--bg3); border: 1px solid var(--line);
  color: var(--ink); font-size: 12.5px;
  padding: 9px 18px; border-radius: 999px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
  max-width: 82vw; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="wrap">

  <header>
    <div id="brand">MUSICLI<em> · Pocket</em></div>
    <div id="conn"><span class="dot"></span><span class="txt" id="conn-txt">未连接</span></div>
    <button class="icbtn" id="btn-set" title="连接设置" aria-label="连接设置">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2.2"/><circle cx="8" cy="16" r="2.2"/></svg>
    </button>
  </header>

  <main>
    <!-- ═══ 播放 ═══ -->
    <section class="view on" id="view-player">
      <div class="np-head">
        <div id="np-title">未在播放</div>
        <div id="np-sub">从曲库或歌单中点选一首</div>
        <div id="np-tags"></div>
      </div>
      <div class="stage">
        <div id="disc" title="轻触查看歌词">
          <div class="disc-label">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div class="disc-hole"></div>
        </div>
        <div id="lyrics"></div>
        <button id="lyr-close" aria-label="关闭歌词">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="hint">轻 触 唱 片 查 看 歌 词</div>
      </div>
      <div class="seek-wrap">
        <div id="seek">
          <div class="track"><div class="buf" id="seek-buf"></div><div class="fill" id="seek-fill"></div></div>
          <div class="knob" id="seek-knob"></div>
        </div>
        <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="cbtn" id="btn-mode" title="播放模式"></button>
        <button class="cbtn" id="btn-prev" title="上一首">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19.5 5v14L9.8 12z"/></svg>
        </button>
        <button id="btn-play" title="播放 / 暂停">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="currentColor" id="ico-play"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="cbtn" id="btn-next" title="下一首">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM4.5 5v14l9.7-7z"/></svg>
        </button>
        <button class="cbtn" id="btn-timer" title="睡眠定时">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.6 1.6M9 2.5h6"/></svg>
          <span class="badge" id="timer-badge"></span>
        </button>
      </div>
      <div class="vol-row">
        <button class="icbtn" id="btn-mute" style="width:30px;height:30px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="ico-vol"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="vol" min="0" max="100" value="80">
      </div>
    </section>

    <!-- ═══ 曲库 ═══ -->
    <section class="view" id="view-lib">
      <div class="bar">
        <input class="search-in" id="lib-search" type="search" placeholder="搜索 歌名 / 艺术家 / 专辑" enterkeyhint="search">
        <button class="icbtn" id="lib-refresh" title="刷新">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg>
        </button>
      </div>
      <div class="list" id="lib-list"></div>
    </section>

    <!-- ═══ 歌单 ═══ -->
    <section class="view" id="view-plist">
      <div class="bar" id="pl-bar">
        <span class="ttl">歌单</span>
        <span class="sp"></span>
        <button class="chipbtn" id="pl-new">＋ 新建</button>
        <button class="chipbtn" id="pl-saveq">存队列</button>
        <button class="icbtn" id="pl-refresh" title="刷新">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg>

  <!-- ═══ 迷你播放条 ═══ -->

      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>

      <span>曲库</span>
    </button>
    <button class="tabbtn" data-view="plist">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span>歌单</span>

      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.6" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3.6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3.6" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
      <span>队列</span>
    </button>
  </nav>
</div>

<!-- ═══ 弹窗 ═══ -->
<div id="mask">
  <div class="card">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div id="m-err"></div>
    <div class="ops">
      <button class="btn" id="m-cancel">取消</button>
      <button class="btn primary" id="m-ok">确定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ═══════════════ 工具 ═══════════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => {
  if (s == null || !isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
};
const baseName = p => {
  const n = String(p || '').split(/[/\\]/).pop() || String(p || '');
  return n.replace(/\.[^.]+$/, '');
};
const fileName = p => String(p || '').split(/[/\\]/).pop() || String(p || '');

const LS = {
  get(k, d) { try { const v = localStorage.getItem('mcli.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mcli.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ═══════════════ 状态 ═══════════════ */
const S = {
  server: '', token: '',
  queue: [], index: -1, mode: 'normal',
  library: [], q: '',
  playlists: [], plistTracks: null, plistName: '',
  lyrics: [], lyricIdx: -1,
  seeking: false, connected: false,
  lyrHoldUntil: 0,
  sleepAt: 0,          // 睡眠定时触发时间戳（0 = 关闭）
};
const A = new Audio();
A.preload = 'auto';

const MODES = [
  { id: 'normal', name: '顺序播放', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg>' },
  { id: 'repeat-all', name: '列表循环', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1.5l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22.5l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>' },
  { id: 'repeat-one', name: '单曲循环', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1.5l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22.5l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="14.6" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">1</text></svg>' },
  { id: 'shuffle', name: '随机播放', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l6 6"/></svg>' },
];

/* ═══════════════ 提示 ═══════════════ */
let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2400);
}

/* ═══════════════ API（/stream?path= 流式播放 + REST） ═══════════════ */
function streamUrl(path) {
  let u = S.server + '/stream?path=' + encodeURIComponent(path);
  if (S.token) u += '&token=' + encodeURIComponent(S.token);
  return u;
}
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  let res;
  try {
    res = await fetch(S.server + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    throw { status: 0, msg: '无法连接服务器' };
  }
  if (!res.ok) {
    let msg = '';
    try { msg = await res.text(); } catch (e) {}
    throw { status: res.status, msg: msg || ('HTTP ' + res.status) };
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) return res.json();
  return res.text();
}
function apiErr(e) {
  if (e.status === 0) return e.msg;
  if (e.status === 401) return '鉴权失败：请检查访问令牌';
  if (e.status === 403) return '服务器未配置 music_folder 或路径越界';
  if (e.status === 404) return '资源不存在';
  if (e.status === 409) return '已存在同名歌单';
  return e.msg || '请求失败';
}

/* ═══════════════ 连接 ═══════════════ */
function setConn(state, txt) {
  const el = $('#conn');
  el.classList.toggle('ok', state === 'ok');
  el.classList.toggle('bad', state === 'bad');
  $('#conn-txt').textContent = txt;
}
async function connect() {
  setConn('', '连接中…');
  try {
    await api('/search?limit=1');
    S.connected = true;
    setConn('ok', S.server.replace(/^https?:\/\//, '') || '本机');
    await Promise.all([loadLibrary(S.q), loadPlaylists()]);
    return true;
  } catch (e) {
    S.connected = false;
    setConn('bad', e.status === 401 ? '需要令牌' : '连接失败');
    $('#lib-list').innerHTML = '<div class="empty"><span class="big">◇</span>' + esc(apiErr(e)) + '<br>点击右上角设置服务器</div>';
    return false;
  }
}
$('#btn-set').addEventListener('click', openSettings);
$('#conn').addEventListener('click', openSettings);

/* ═══════════════ 视图切换 ═══════════════ */
let curView = 'player';
function switchView(v) {
  curView = v;
  $$('.tabbtn').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
  renderMini();
}
$$('.tabbtn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

/* ═══════════════ 列表渲染（共用） ═══════════════ */
function curTrack() { return S.index >= 0 && S.index < S.queue.length ? S.queue[S.index] : null; }
function rowHtml(t, i, ctx) {
  const cur = curTrack();
  const isCur = cur && cur.path === t.path;
  const eq = isCur && !A.paused;
  return '<div class="tr' + (isCur ? ' cur' : '') + '" data-i="' + i + '" data-ctx="' + ctx + '">' +
    '<span class="idx">' + (isCur ? '<span class="eq' + (eq ? '' : ' paused') + '"><i></i><i></i><i></i></span>' : (i + 1)) + '</span>' +
    '<span class="meta"><span class="t1">' + esc(t.title || baseName(t.name || t.path)) + '</span>' +
    '<span class="t2">' + esc(t.artist ? (t.artist + (t.album ? ' · ' + t.album : '')) : (t.name || fileName(t.path))) + '</span></span>' +
    (ctx === 'queue'
      ? '<button class="mini del" title="移出队列"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>'
      : '<button class="mini add" title="加入队列"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>') +
    '<span class="dur">' + fmt(t.duration) + '</span>' +
    '</div>';
}
function renderTrackList(box, list, ctx, emptyHtml) {
  if (!list.length) { box.innerHTML = emptyHtml; return; }
  box.innerHTML = list.map((t, i) => rowHtml(t, i, ctx)).join('');
}
/* 列表点击委托（曲库 / 歌单详情 / 队列） */
function onListClick(e) {
  const row = e.target.closest('.tr');
  if (!row) return;
  const i = +row.dataset.i, ctx = row.dataset.ctx;
  const list = ctx === 'queue' ? S.queue : ctx === 'plist' ? (S.plistTracks || []) : S.library;
  if (e.target.closest('.add')) {
    S.queue.push(list[i]); persist(); renderQueue();
    toast('已加入队列：' + (list[i].title || baseName(list[i].name || list[i].path)));
    return;
  }
  if (e.target.closest('.del')) { removeFromQueue(i); return; }
  if (ctx === 'queue') { playAt(i); return; }
  S.queue = list.slice(); playAt(i);
}
$('#lib-list').addEventListener('click', onListClick);
$('#pld-list').addEventListener('click', onListClick);
$('#q-list').addEventListener('click', onListClick);

/* ═══════════════ 曲库 ═══════════════ */
async function loadLibrary(q) {
  const hits = await api('/search?limit=500' + (q ? '&q=' + encodeURIComponent(q) : ''));
  S.library = (hits || []).map(h => ({
    path: h.path, name: h.name || fileName(h.path),
    title: h.title || '', artist: h.artist || '', album: h.album || '',
    duration: h.duration || 0,
  }));
  renderTrackList($('#lib-list'), S.library, 'lib',
    '<div class="empty"><span class="big">◇</span>' + (q ? '未找到匹配「' + esc(q) + '」的曲目' : '曲库为空') + '</div>');
}
let searchTimer = null;
$('#lib-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    S.q = $('#lib-search').value.trim();
    try { await loadLibrary(S.q); } catch (e) { toast(apiErr(e)); }
  }, 350);
});
$('#lib-refresh').addEventListener('click', async () => {
  try { await loadLibrary(S.q); toast('曲库已刷新'); } catch (e) { toast(apiErr(e)); }
});

/* ═══════════════ 歌单 ═══════════════ */
async function loadPlaylists() {
  try { S.playlists = await api('/playlists') || []; }
  catch (e) { S.playlists = []; }
  renderPlaylists();
}
function renderPlaylists() {
  $('#pl-bar').style.display = '';
  $('#pld-bar').style.display = 'none';
  $('#pld-list').style.display = 'none';
  $('#pl-list').style.display = '';
  S.plistTracks = null;
  const box = $('#pl-list');
  if (!S.playlists.length) {
    box.innerHTML = '<div class="empty"><span class="big">◇</span>尚无歌单<br>点「＋ 新建」创建，或将当前队列存为歌单</div>';
    return;
  }
  box.innerHTML = S.playlists.map(p =>
    '<div class="pl" data-name="' + esc(p.name) + '">' +
    '<div class="nm">' + esc(p.name) + '<span class="cnt">' + (p.track_count || 0) + ' 首</span></div>' +
    (p.desc ? '<div class="ds">' + esc(p.desc) + '</div>' : '') +
    '<div class="ops">' +
    '<button class="chipbtn act-play">▶ 播放</button>' +
    '<button class="chipbtn act-open">打开</button>' +
    '<button class="chipbtn danger act-del">删除</button>' +
    '</div></div>'
  ).join('');
}
$('#pl-list').addEventListener('click', async e => {
  const card = e.target.closest('.pl');
  if (!card) return;
  const name = card.dataset.name;
  if (e.target.closest('.act-del')) {
    if (!confirm('删除歌单「' + name + '」？（不影响音频文件）')) return;
    try { await api('/playlists/single?name=' + encodeURIComponent(name), { method: 'DELETE' }); toast('已删除「' + name + '」'); loadPlaylists(); }
    catch (err) { toast(apiErr(err)); }
    return;
  }
  if (e.target.closest('.act-play')) {
    try {
      const pl = await api('/playlists/single?name=' + encodeURIComponent(name));
      const tracks = (pl && pl.tracks || []).map(p => ({ path: p, name: fileName(p) }));
      if (!tracks.length) { toast('歌单为空'); return; }
      S.queue = tracks; playAt(0);
      toast('播放歌单「' + name + '」');
    } catch (err) { toast(apiErr(err)); }
    return;
  }
  openPlaylist(name);
});
async function openPlaylist(name) {
  let pl;
  try { pl = await api('/playlists/single?name=' + encodeURIComponent(name)); }
  catch (e) { toast(apiErr(e)); return; }
  S.plistName = name;
  S.plistTracks = (pl && pl.tracks || []).map(p => ({ path: p, name: fileName(p) }));
  $('#pl-bar').style.display = 'none';
  $('#pl-list').style.display = 'none';
  $('#pld-bar').style.display = '';
  $('#pld-list').style.display = '';
  $('#pld-name').textContent = name;
  $('#pld-cnt').textContent = S.plistTracks.length + ' 首';
  renderTrackList($('#pld-list'), S.plistTracks, 'plist', '<div class="empty">歌单暂无曲目</div>');
}
$('#pl-back').addEventListener('click', renderPlaylists);
$('#pl-refresh').addEventListener('click', () => { loadPlaylists(); toast('已刷新'); });
$('#pld-playall').addEventListener('click', () => {
  if (!S.plistTracks || !S.plistTracks.length) return;
  S.queue = S.plistTracks.slice(); playAt(0);
});
$('#pld-addall').addEventListener('click', () => {
  if (!S.plistTracks || !S.plistTracks.length) return;
  S.queue.push(...S.plistTracks); persist(); renderQueue();
  toast('已加入 ' + S.plistTracks.length + ' 首');
});
$('#pl-new').addEventListener('click', () => {
  showModal('新建歌单', [
    { key: 'name', label: '歌单名称', ph: '例如：深夜循环' },
    { key: 'desc', label: '简介（可留空）', ph: '' },
  ], async vals => {
    if (!vals.name.trim()) return '名称不能为空';
    try {
      await api('/playlists', { method: 'POST', body: JSON.stringify({ name: vals.name.trim(), desc: vals.desc.trim(), tracks: [] }) });
      toast('已创建「' + vals.name.trim() + '」'); loadPlaylists();
    } catch (e) { return apiErr(e); }
  });
});
$('#pl-saveq').addEventListener('click', () => {
  if (!S.queue.length) { toast('当前队列为空'); return; }
  showModal('队列存为歌单', [
    { key: 'name', label: '歌单名称', ph: '例如：今晚的歌' },
    { key: 'desc', label: '简介（可留空）', ph: '' },
  ], async vals => {
    if (!vals.name.trim()) return '名称不能为空';
    try {
      await api('/playlists', { method: 'POST', body: JSON.stringify({ name: vals.name.trim(), desc: vals.desc.trim(), tracks: S.queue.map(t => t.path) }) });
      toast('已保存 ' + S.queue.length + ' 首到「' + vals.name.trim() + '」'); loadPlaylists();
    } catch (e) { return apiErr(e); }
  });
});

/* ═══════════════ 队列 ═══════════════ */
function renderQueue() {
  $('#q-cnt').textContent = S.queue.length ? S.queue.length + ' 首' : '';
  renderTrackList($('#q-list'), S.queue, 'queue',
    '<div class="empty"><span class="big">◇</span>播放队列为空<br>到曲库点选，即刻成队</div>');
}
function removeFromQueue(i) {
  if (i < 0 || i >= S.queue.length) return;
  const wasCur = i === S.index;
  S.queue.splice(i, 1);
  if (i < S.index) S.index--;
  if (wasCur) {
    A.pause(); A.removeAttribute('src'); A.load();
    S.index = -1; S.lyrics = [];
    renderNowPlaying(null); renderLyrics();
  }
  persist(); renderQueue(); renderLibHighlight();
}
function renderLibHighlight() {
  // 曲库 / 歌单详情中的当前行高亮随队列变化刷新
  if (S.library.length) renderTrackList($('#lib-list'), S.library, 'lib', '');
  if (S.plistTracks) renderTrackList($('#pld-list'), S.plistTracks, 'plist', '');
}
$('#q-clear').addEventListener('click', () => {
  if (!S.queue.length) return;
  if (!confirm('清空播放队列？')) return;
  A.pause(); A.removeAttribute('src'); A.load();
  S.queue = []; S.index = -1; S.lyrics = [];
  renderNowPlaying(null); renderLyrics(); renderQueue(); renderLibHighlight(); persist();
});

/* ═══════════════ 播放核心（/stream?path= 文件流） ═══════════════ */
async function playAt(i, opts) {
  opts = opts || {};
  if (i < 0 || i >= S.queue.length) return;
  S.index = i;
  const tr = S.queue[i];
  S.lyrics = []; S.lyricIdx = -1; S.lyrHoldUntil = 0; renderLyrics();
  A.src = streamUrl(tr.path);
  if (opts.resumeAt) {
    const pos = opts.resumeAt;
    A.addEventListener('loadedmetadata', function once() {
      A.removeEventListener('loadedmetadata', once);
      try { A.currentTime = pos; } catch (e) {}
    });
  }
  renderNowPlaying(tr);
  renderQueue(); renderLibHighlight(); persist();
  if (!opts.noPlay) {
    try { await A.play(); } catch (e) {
      if (e && e.name === 'NotAllowedError') toast('浏览器拦截了自动播放，请点一次播放');
    }
  }
  loadMeta(tr);
  loadLyrics(tr);
  updateMediaSession(tr);
}
async function loadMeta(tr) {
  try {
    const m = await api('/metadata?path=' + encodeURIComponent(tr.path));
    if (curTrack() !== tr) return;
    if (m) {
      tr.title = m.title || tr.title || '';
      tr.artist = m.artist || tr.artist || '';
      tr.album = m.album || tr.album || '';
      tr.codec = m.codec || ''; tr.bitrate = m.bitrate || 0; tr.sampleRate = m.sample_rate || 0;
      if (!tr.duration && m.duration) tr.duration = m.duration;
      renderNowPlaying(tr); renderQueue(); renderLibHighlight();
      updateMediaSession(tr);
    }
  } catch (e) { /* 403/404 用文件名兜底 */ }
}
async function loadLyrics(tr) {
  try {
    const arr = await api('/lyrics/parse?audio_path=' + encodeURIComponent(tr.path));
    if (curTrack() !== tr) return;
    S.lyrics = (Array.isArray(arr) ? arr : []).filter(l => l && isFinite(l.time)).sort((a, b) => a.time - b.time);
    S.lyricIdx = -1;
  } catch (e) { S.lyrics = []; }
  renderLyrics();
}
function renderNowPlaying(tr) {
  if (!tr) {
    $('#np-title').textContent = '未在播放';
    $('#np-sub').textContent = '从曲库或歌单中点选一首';
    $('#np-tags').innerHTML = '';
    $('#t-dur').textContent = '0:00';
    renderMini();
    return;
  }
  $('#np-title').textContent = tr.title || baseName(tr.name || tr.path);
  const sub = [tr.artist, tr.album].filter(Boolean).join(' · ');
  $('#np-sub').textContent = sub || (tr.name || fileName(tr.path));
  const tags = [];
  if (tr.codec) tags.push(tr.codec);
  if (tr.bitrate) tags.push(Math.round(tr.bitrate) + ' kbps');
  if (tr.sampleRate) tags.push((tr.sampleRate / 1000).toFixed(1) + ' kHz');
  $('#np-tags').innerHTML = tags.map(t => '<span class="ntag">' + esc(t) + '</span>').join('');
  $('#t-dur').textContent = fmt(tr.duration || A.duration);
  renderMini();
}

/* ═══════════════ 歌词 ═══════════════ */
function renderLyrics() {
  const box = $('#lyrics');
  box.scrollTop = 0;
  if (!S.lyrics.length) {
    box.innerHTML = '<div class="lyr-empty">' + (S.index >= 0 ? '暂 无 歌 词' : '♪') + '</div>';
    return;
  }
  box.innerHTML = S.lyrics.map((l, i) =>
    '<div class="ll' + (i === S.lyricIdx ? ' cur' : '') + '" data-t="' + l.time + '">' + esc(l.text || '♪') + '</div>'
  ).join('');
}
function syncLyric(t) {
  if (!S.lyrics.length) return;
  const arr = S.lyrics;
  let idx = S.lyricIdx;
  if (idx >= 0 && idx < arr.length) {
    while (idx + 1 < arr.length && arr[idx + 1].time <= t) idx++;
    while (idx >= 0 && arr[idx].time > t) idx--;
  } else {
    let lo = 0, hi = arr.length - 1; idx = -1;
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (arr[mid].time <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1; }
  }
  if (idx === S.lyricIdx) return;
  const prev = S.lyricIdx;
  S.lyricIdx = idx;
  const lines = $$('#lyrics .ll');
  lines.forEach((el, i) => el.classList.toggle('cur', i === idx));
  if (idx >= 0 && Date.now() > S.lyrHoldUntil && lines[idx]) {
    const box = $('#lyrics'), line = lines[idx];
    const target = line.offsetTop - box.offsetTop - (box.clientHeight - line.offsetHeight) / 2;
    box.scrollTo({ top: Math.max(0, target), behavior: Math.abs(idx - prev) > 6 ? 'auto' : 'smooth' });
  }
}
$('#disc').addEventListener('click', () => { $('#lyrics').classList.add('on'); });
$('#lyr-close').addEventListener('click', () => { $('#lyrics').classList.remove('on'); });
$('#lyrics').addEventListener('click', e => {
  const line = e.target.closest('.ll');
  if (line) { const t = +line.dataset.t; if (isFinite(t)) { try { A.currentTime = t; } catch (e) {} syncLyric(t); } }
});
$('#lyrics').addEventListener('wheel', () => { S.lyrHoldUntil = Date.now() + 6000; }, { passive: true });
$('#lyrics').addEventListener('touchmove', () => { S.lyrHoldUntil = Date.now() + 6000; }, { passive: true });

/* ═══════════════ 切歌 / 模式 ═══════════════ */
function nextIndex(auto) {
  const n = S.queue.length;
  if (!n) return -1;
  if (S.mode === 'shuffle') {
    if (n === 1) return 0;
    let i; do { i = Math.floor(Math.random() * n); } while (i === S.index);
    return i;
  }
  const i = S.index + 1;
  if (i >= n) return (S.mode === 'repeat-all' || !auto) ? 0 : -1;
  return i;
}
function nextTrack(auto) {
  if (S.mode === 'repeat-one' && auto) { A.currentTime = 0; A.play().catch(() => {}); return; }
  const i = nextIndex(auto);
  if (i < 0) { renderPlayBtn(); return; }
  playAt(i);
}
function prevTrack() {
  if (A.currentTime > 3 && S.index >= 0) { A.currentTime = 0; return; }
  const n = S.queue.length;
  if (!n) return;
  let i = S.mode === 'shuffle' ? nextIndex(true) : (S.index - 1 + n) % n;
  playAt(i);
}
function renderModeBtn() {
  const m = MODES.find(m => m.id === S.mode) || MODES[0];
  $('#btn-mode').innerHTML = m.svg;
  $('#btn-mode').classList.toggle('active', S.mode !== 'normal');
  $('#btn-mode').title = '播放模式：' + m.name;
}
$('#btn-mode').addEventListener('click', () => {
  const i = MODES.findIndex(m => m.id === S.mode);
  S.mode = MODES[(i + 1) % MODES.length].id;
  renderModeBtn(); persist();
  toast('播放模式：' + MODES[(i + 1) % MODES.length].name);
});
$('#btn-next').addEventListener('click', () => nextTrack(false));
$('#btn-prev').addEventListener('click', prevTrack);

/* ═══════════════ 睡眠定时 ═══════════════ */
const TIMER_STEPS = [0, 10, 20, 30, 60]; // 分钟，0 = 关
let timerTicker = null;
function renderTimer() {
  const btn = $('#btn-timer'), badge = $('#timer-badge');
  if (!S.sleepAt) {
    btn.classList.remove('active');
    badge.textContent = '';
    if (timerTicker) { clearInterval(timerTicker); timerTicker = null; }
    return;
  }
  btn.classList.add('active');
  const tick = () => {
    const left = Math.max(0, Math.round((S.sleepAt - Date.now()) / 1000));
    if (left <= 0) {
      S.sleepAt = 0; renderTimer();
      A.pause(); toast('睡眠定时已到，已暂停');
      return;
    }
    badge.textContent = Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
  };
  tick();
  if (timerTicker) clearInterval(timerTicker);
  timerTicker = setInterval(tick, 1000);
}
$('#btn-timer').addEventListener('click', () => {
  let cur = 0;
  if (S.sleepAt) {
    const leftMin = (S.sleepAt - Date.now()) / 60000;
    cur = TIMER_STEPS.findIndex(m => m > 0 && Math.abs(leftMin - m) < 1.2);
    if (cur < 0) cur = 0;
  }
  const next = TIMER_STEPS[(cur + 1) % TIMER_STEPS.length];
  if (next === 0) {
    S.sleepAt = 0; renderTimer(); toast('睡眠定时已关闭');
  } else {
    S.sleepAt = Date.now() + next * 60000; renderTimer();
    toast(next + ' 分钟后暂停播放');
  }
});

/* ═══════════════ 播放/暂停按钮 & 音频事件 ═══════════════ */
const ICO_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICO_PAUSE = '<path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.6z"/>';
function renderPlayBtn() {
  $('#ico-play').innerHTML = A.paused ? ICO_PLAY : ICO_PAUSE;
  $('#mi-ico').innerHTML = A.paused ? ICO_PLAY : ICO_PAUSE;
  $('#disc').classList.toggle('playing', !A.paused);
  $('#mini').classList.toggle('playing', !A.paused);
  $$('.eq').forEach(el => el.classList.toggle('paused', A.paused));
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.playbackState = A.paused ? 'paused' : 'playing'; } catch (e) {}
  }
}
function togglePlay() {
  if (A.paused) {
    if (S.index < 0 && S.queue.length) { playAt(0); return; }
    A.play().catch(e => { if (e && e.name === 'NotAllowedError') toast('请再点一次播放'); });
  } else A.pause();
}
$('#btn-play').addEventListener('click', togglePlay);
$('#mi-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('#mini').addEventListener('click', () => switchView('player'));

A.addEventListener('play', renderPlayBtn);
A.addEventListener('pause', () => { renderPlayBtn(); persist(); });
A.addEventListener('ended', () => nextTrack(true));
A.addEventListener('waiting', () => $('#btn-play').classList.add('loading'));
A.addEventListener('playing', () => $('#btn-play').classList.remove('loading'));
A.addEventListener('loadedmetadata', () => {
  const tr = curTrack();
  if (tr && !tr.duration && isFinite(A.duration)) { tr.duration = A.duration; $('#t-dur').textContent = fmt(A.duration); }
});
A.addEventListener('durationchange', () => {
  if (isFinite(A.duration)) $('#t-dur').textContent = fmt(A.duration);
});
A.addEventListener('error', () => {
  $('#btn-play').classList.remove('loading');
  if (!A.getAttribute('src')) return;
  const tr = curTrack();
  toast('播放失败：' + (tr ? fileName(tr.path) : '') + '（浏览器或不支持该编码）');
});

/* ═══════════════ 进度条（rAF 驱动 + 指针拖动） ═══════════════ */
function durNow() {
  const tr = curTrack();
  return (tr && tr.duration) || (isFinite(A.duration) ? A.duration : 0) || 0;
}
function paintSeek(pos) {
  const d = durNow() || 1;
  const p = Math.max(0, Math.min(1, pos / d));
  $('#seek-fill').style.transform = 'scaleX(' + p + ')';
  $('#seek-knob').style.left = (p * 100) + '%';
  $('#t-cur').textContent = fmt(pos);
  $('#mi-fill').style.width = (p * 100) + '%';
}
function paintBuf() {
  const d = durNow();
  if (!d || !A.buffered || !A.buffered.length) return;
  try {
    const end = A.buffered.end(A.buffered.length - 1);
    $('#seek-buf').style.transform = 'scaleX(' + Math.max(0, Math.min(1, end / d)) + ')';
  } catch (e) {}
}
(function raf() {
  requestAnimationFrame(raf);
  if (!S.seeking && !A.paused) paintSeek(A.currentTime);
  if (!A.paused) { paintBuf(); syncLyric(A.currentTime); }
})();
const seek = $('#seek');
function seekFromEvent(e) {
  const r = seek.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  paintSeek(p * durNow());
  return p * durNow();
}
seek.addEventListener('pointerdown', e => {
  if (!durNow()) return;
  S.seeking = true;
  seek.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
seek.addEventListener('pointermove', e => { if (S.seeking) seekFromEvent(e); });
seek.addEventListener('pointerup', e => {
  if (!S.seeking) return;
  const t = seekFromEvent(e);
  try { A.currentTime = t; } catch (err) {}
  S.seeking = false;
  syncLyric(t);
});
seek.addEventListener('pointercancel', () => { S.seeking = false; });

/* ═══════════════ 音量 ═══════════════ */
const vol = $('#vol');
function setVol(v, skipSave) {
  v = Math.max(0, Math.min(100, v));
  vol.value = v;
  vol.style.setProperty('--fill', v + '%');
  A.volume = v / 100;
  if (!skipSave) LS.set('vol', v);
}
vol.addEventListener('input', () => { A.muted = false; setVol(+vol.value); renderMute(); });
function renderMute() {
  $('#ico-vol').innerHTML = (A.muted || A.volume === 0)
    ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
}
$('#btn-mute').addEventListener('click', () => { A.muted = !A.muted; renderMute(); });

/* ═══════════════ 迷你播放条 ═══════════════ */
function renderMini() {
  const tr = curTrack();
  const show = !!tr && curView !== 'player';
  $('#mini').classList.toggle('on', show);
  if (!tr) return;
  $('#mi-title').textContent = tr.title || baseName(tr.name || tr.path);
  $('#mi-sub').textContent = [tr.artist, tr.album].filter(Boolean).join(' · ') || (tr.name || fileName(tr.path));
}

/* ═══════════════ MediaSession（锁屏控制） ═══════════════ */
function updateMediaSession(tr) {
  if (!('mediaSession' in navigator) || !tr) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: tr.title || baseName(tr.name || tr.path),
      artist: tr.artist || 'MusiCLI',
      album: tr.album || '',
    });
    navigator.mediaSession.setActionHandler('play', () => A.play());
    navigator.mediaSession.setActionHandler('pause', () => A.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  } catch (e) {}
}

/* ═══════════════ 桌面快捷键 ═══════════════ */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || $('#mask').classList.contains('show')) return;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': if (curTrack()) A.currentTime = Math.min(durNow(), A.currentTime + 5); break;
    case 'ArrowLeft': if (curTrack()) A.currentTime = Math.max(0, A.currentTime - 5); break;
    case 'ArrowUp': e.preventDefault(); setVol(+vol.value + 5); renderMute(); break;
    case 'ArrowDown': e.preventDefault(); setVol(+vol.value - 5); renderMute(); break;
    case 'n': nextTrack(false); break;
    case 'p': prevTrack(); break;
    case 'm': $('#btn-mode').click(); break;
  }
});

/* ═══════════════ 弹窗 ═══════════════ */
let modalOk = null;
function showModal(title, fields, onOk) {
  $('#m-title').textContent = title;
  $('#m-err').textContent = '';
  $('#m-body').innerHTML = fields.map(f =>
    '<div class="f-field"><label>' + esc(f.label) + '</label>' +
    '<input data-k="' + esc(f.key) + '" type="' + (f.type || 'text') + '" placeholder="' + esc(f.ph || '') + '" value="' + esc(f.val || '') + '"></div>'
  ).join('');
  modalOk = onOk;
  $('#mask').classList.add('show');
  const first = $('#m-body input');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal() { $('#mask').classList.remove('show'); modalOk = null; }
$('#m-cancel').addEventListener('click', closeModal);
$('#mask').addEventListener('click', e => { if (e.target === $('#mask')) closeModal(); });
$('#m-ok').addEventListener('click', async () => {
  if (!modalOk) return closeModal();
  const vals = {};
  $$('#m-body input').forEach(i => vals[i.dataset.k] = i.value);
  const err = await modalOk(vals);
  if (err) { $('#m-err').textContent = err; return; }
  closeModal();
});
$('#m-body').addEventListener('keydown', e => { if (e.key === 'Enter') $('#m-ok').click(); });

function openSettings() {
  showModal('连接设置', [
    { key: 'server', label: '服务器地址', ph: 'http://127.0.0.1:52013', val: S.server },
    { key: 'token', label: '访问令牌（未启用可留空）', ph: '可选', val: S.token },
  ], async vals => {
    const sv = (vals.server || '').trim().replace(/\/+$/, '');
    if (!/^https?:\/\/.+/.test(sv)) return '地址需以 http:// 或 https:// 开头';
    S.server = sv; S.token = (vals.token || '').trim();
    LS.set('server', S.server); LS.set('token', S.token);
    const ok = await connect();
    return ok ? null : '连接失败，请检查地址与令牌';
  });
}

/* ═══════════════ 持久化 ═══════════════ */
function persist() {
  LS.set('queue', { queue: S.queue, index: S.index, mode: S.mode, pos: A.currentTime || 0 });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
addEventListener('pagehide', persist);

/* ═══════════════ PWA Service Worker ═══════════════ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ═══════════════ 启动 ═══════════════ */
function boot() {
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) document.body.classList.add('ios');
  // 服务器：URL 参数 > 本地存储 > 同源 / 默认端口
  const qp = new URLSearchParams(location.search);
  const defServer = location.protocol.startsWith('http') ? location.origin : 'http://127.0.0.1:52013';
  S.server = (qp.get('server') || LS.get('server', '') || defServer).replace(/\/+$/, '');
  S.token = qp.get('token') != null ? qp.get('token') : LS.get('token', '');
  if (qp.get('server')) LS.set('server', S.server);
  if (qp.get('token') != null) LS.set('token', S.token);
  // 音量 / 模式
  setVol(LS.get('vol', 80), true); renderMute();
  S.mode = MODES.some(m => m.id === LS.get('mode')) ? LS.get('mode') : 'normal';
  renderModeBtn(); renderPlayBtn(); renderTimer();
  renderQueue();
  // 单曲分享模式：?path=<audio> 直接流式播放该文件
  const sharePath = qp.get('path');
  if (sharePath) {
    S.queue = [{ path: sharePath, name: fileName(sharePath) }];
    playAt(0);
  } else {
    // 恢复上次队列（暂停态，定位到上次进度）
    const saved = LS.get('queue', null);
    if (saved && Array.isArray(saved.queue) && saved.queue.length) {
      S.queue = saved.queue;
      if (saved.index >= 0 && saved.index < S.queue.length) {
        playAt(saved.index, { resumeAt: saved.pos || 0, noPlay: true });
      }
    }
  }
  renderQueue();
  setInterval(() => { if (!A.paused) persist(); }, 5000);
  connect();
}
boot();
</script>
</body>
