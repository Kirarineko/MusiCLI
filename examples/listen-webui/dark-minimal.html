<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一起听 · MusiCLI</title>
<style>
:root {
  --bg: #0a0a0b;
  --txt: #ededee;
  --mut: #71717a;
  --faint: #3b3b42;
  --line: #1f1f24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--txt); overflow: hidden;
  font-family: "Inter", -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(90% 70% at 50% 44%, rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 60%);
}

/* ── 顶栏 ───────────────────────────────────── */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  padding: 26px 34px;
  font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--mut);
}
.status { display: flex; align-items: center; gap: 10px; letter-spacing: .16em; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; }
.dot.on { background: #c9c9ce; }
.dot.play { background: #ffffff; animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ── 中央 ───────────────────────────────────── */
.mid {
  position: fixed; inset: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 0 28px;
}
.state-line {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; letter-spacing: .42em; text-indent: .1em; text-transform: uppercase;
  color: var(--mut); margin-bottom: 30px;
}
.eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 12px; }
.eq i { width: 2px; height: 3px; background: var(--faint); transition: background .3s; }
.eq.play i { background: #e8e8ea; animation: eq .9s ease-in-out infinite; }
.eq.play i:nth-child(2) { animation-delay: .18s; }
.eq.play i:nth-child(3) { animation-delay: .36s; }
.eq.play i:nth-child(4) { animation-delay: .54s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

.title {
  font-size: clamp(36px, 6.4vw, 68px); font-weight: 620; letter-spacing: -.02em;
  line-height: 1.08; max-width: 20ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.artist { margin-top: 18px; font-size: 14px; color: var(--mut); letter-spacing: .08em; }
.chips { margin-top: 12px; font-size: 11px; color: var(--faint); letter-spacing: .16em; min-height: 14px; }

.lyrics {
  margin-top: 46px; min-height: 92px;
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.l-cur { font-size: 17.5px; color: #dbdbe0; letter-spacing: .04em; }
.l-next { font-size: 13px; color: var(--mut); opacity: .6; }
.l-next.far { opacity: .32; }
.l-empty { font-size: 13px; color: var(--faint); font-style: italic; }
.swap-in { animation: swap-in .5s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes swap-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── 底部 ───────────────────────────────────── */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 34px 26px; }
.prow { display: flex; align-items: center; gap: 18px; }
.time {
  font-size: 11px; color: var(--mut); min-width: 40px; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
}
.bar { position: relative; flex: 1; height: 1px; background: var(--line); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #f2f2f3; }
.fill::after {
  content: ""; position: absolute; right: -3.5px; top: 50%;
  width: 7px; height: 7px; border-radius: 50%; background: #fff;
  transform: translateY(-50%); box-shadow: 0 0 10px rgba(255, 255, 255, .35);
}
.under { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--faint); }
.vol { display: flex; align-items: center; gap: 12px; color: var(--mut); }
.vol svg { width: 15px; height: 15px; fill: currentColor; opacity: .8; }
.vol input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 96px; height: 2px; background: #26262c; outline: none; cursor: pointer;
}
.vol input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 10px; height: 10px; border-radius: 50%; background: #dcdce0; border: none;
}
.vol input[type="range"]::-moz-range-thumb {
  width: 10px; height: 10px; border-radius: 50%; background: #dcdce0; border: none;
}

/* ── 启幕 ───────────────────────────────────── */
.gate {
  position: fixed; inset: 0; z-index: 60; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: rgba(7, 7, 8, .97);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.gate.hidden { display: none; }
.gate-inner { text-align: center; }
.gate-btn {
  display: inline-block; padding: 17px 46px;
  border: 1px solid #2c2c32; color: #e8e8ea;
  font-size: 12px; letter-spacing: .5em; text-indent: .5em;
  transition: background .3s, color .3s, border-color .3s;
}
.gate:hover .gate-btn { background: #f2f2f3; color: #0a0a0b; border-color: #f2f2f3; }
.gate-hint { margin-top: 20px; font-size: 11px; letter-spacing: .18em; color: var(--mut); }

@media (max-width: 560px) {
  .top, .bottom { padding-left: 22px; padding-right: 22px; }
  .vol input[type="range"] { width: 64px; }
}
</style>
</head>
<body>

<header class="top">
  <span>MusiCLI — 一起听</span>
  <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中</span></span>
</header>

<main class="mid">
  <div class="state-line">
    <span class="eq" id="eq"><i></i><i></i><i></i><i></i></span>
    <span id="stateLabel">待播</span>
  </div>
  <h1 class="title" id="title">静候佳音</h1>
  <div class="artist" id="artist">&nbsp;</div>
  <div class="chips" id="chips"></div>
  <div class="lyrics" id="lyrics"><div class="l-empty">暂无歌词</div></div>
</main>

<footer class="bottom">
  <div class="prow">
    <span class="time" id="timePos">0:00</span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="time" id="timeDur">0:00</span>
  </div>
  <div class="under">
    <span class="brand">Listen Together</span>
    <span class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="音量">
    </span>
  </div>
</footer>

<div class="gate" id="gate">
  <div class="gate-inner">
    <span class="gate-btn">进 入</span>
    <div class="gate-hint">浏览器需要用户交互才能播放音频</div>
  </div>
</div>

<!--MUSICLI_JS-->
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  // ── 先绑定启幕层 ─────────────────────────────
  var gate = $('#gate');
  var gateOff = false;
  var player = null;

  function dismissGate() {
    if (gateOff) return;
    gateOff = true;
    gate.classList.add('hidden');
    if (player) player.resume();
  }
  gate.addEventListener('click', dismissGate);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
    dismissGate();
  });

  if (typeof MusiCLIPlayer === 'undefined') {
    gate.querySelector('.gate-btn').textContent = '加载失败';
    gate.querySelector('.gate-hint').textContent = 'musicli.js 未就绪，请检查服务';
    return;
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderLyrics() {
    var el = $('#lyrics');
    var lyrics = player.lyrics;
    var idx = player.currentLyricIndex;
    if (!lyrics.length) {
      el.innerHTML = '<div class="l-empty">纯音乐 · 请欣赏</div>';
      return;
    }
    var html = '';
    if (idx >= 0 && idx < lyrics.length) {
      html += '<div class="l-cur swap-in">' + escapeHtml(lyrics[idx].text) + '</div>';
      if (idx + 1 < lyrics.length) html += '<div class="l-next">' + escapeHtml(lyrics[idx + 1].text) + '</div>';
      if (idx + 2 < lyrics.length) html += '<div class="l-next far">' + escapeHtml(lyrics[idx + 2].text) + '</div>';
    } else {
      for (var i = 0; i < Math.min(2, lyrics.length); i++) {
        html += '<div class="l-next' + (i === 1 ? ' far' : '') + '">' + escapeHtml(lyrics[i].text) + '</div>';
      }
    }
    el.innerHTML = html;
  }

  function updateStatus() {
    var dot = $('#statusDot');
    var text = $('#statusText');
    var label = $('#stateLabel');
    var eq = $('#eq');
    dot.className = 'dot';
    eq.className = 'eq';
    if (!player.connected) {
      text.textContent = '连接中';
      label.textContent = '待播';
    } else if (player.playing) {
      dot.className = 'dot on play';
      eq.className = 'eq play';
      text.textContent = '同步中';
      label.textContent = '正在播放';
    } else {
      dot.className = 'dot on';
      text.textContent = '已连接';
      label.textContent = '已暂停';
    }
  }

  player = new MusiCLIPlayer();

  player.on('track', function (track) {
    var title = track.title || '未知曲目';
    var artist = track.artist || '';
    var album = track.album || '';

    var t = $('#title');
    t.classList.remove('swap-in');
    void t.offsetWidth;
    t.textContent = title;
    t.classList.add('swap-in');

    var meta = artist;
    if (album) meta += (meta ? ' — ' : '') + album;
    $('#artist').textContent = meta || ' ';

    var chips = [];
    if (track.codec) chips.push(String(track.codec).toUpperCase());
    if (track.sample_rate) chips.push((track.sample_rate / 1000).toFixed(1).replace(/\.0$/, '') + ' kHz');
    if (track.bitrate) chips.push(Math.round(track.bitrate / 1000) + ' kbps');
    $('#chips').textContent = chips.join(' · ');

    $('#timeDur').textContent = MusiCLIPlayer.formatTime(track.duration);
    renderLyrics();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: album });
    }
    updateStatus();
  });

  player.on('state', function (s) {
    $('#timeDur').textContent = MusiCLIPlayer.formatTime(s.duration);
    updateStatus();
  });

  player.on('tick', function (pos) {
    $('#timePos').textContent = MusiCLIPlayer.formatTime(pos);
    var pct = player.duration > 0 ? Math.min(100, pos / player.duration * 100) : 0;
    $('#fill').style.width = pct + '%';
  });

  player.on('lyric', function () { renderLyrics(); });
  player.on('connect', updateStatus);
  player.on('disconnect', function () {
    $('#statusDot').className = 'dot';
    $('#statusText').textContent = '已断开';
    $('#stateLabel').textContent = '重连中';
    $('#eq').className = 'eq';
  });
  player.on('play', function () {
    gateOff = true;
    gate.classList.add('hidden');
  });

  // 本地音量（仅影响本端，只读原则不控制主机）
  $('#vol').addEventListener('input', function (e) {
    if (player) player.setVolume(e.target.value / 100);
  });

  updateStatus();
  player.start();
})();
</script>
</body>
</html>
