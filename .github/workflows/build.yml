name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin musicli
      - uses: actions/upload-artifact@v4
        with:
          name: musicli-windows-x86_64
          path: target/release/musicli.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release binary
        run: cargo build --release --bin musicli
      - uses: actions/upload-artifact@v4
        with:
          name: musicli-linux-x86_64
          path: target/release/musicli

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin musicli
      - uses: actions/upload-artifact@v4
        with:
          name: musicli-macos-arm64
          path: target/release/musicli
