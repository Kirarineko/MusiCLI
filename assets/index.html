<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>musicli@listen — 一起听</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #060907;
  --term: #0a0f0c;
  --border: #1c2a21;
  --text: #cfe3d6;
  --mut: #5f7a69;
  --dim: #3d5247;
  --accent: #46d98a;
  --accent-hi: #7dedb0;
  --amber: #e5c07b;
  --red: #e06c75;
  --glow: rgba(70, 217, 138, .35);
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas',
    'Noto Sans Mono CJK SC', 'Microsoft YaHei UI', monospace;
  font-size: 14px;
  line-height: 1.75;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CRT 扫描线 + 暗角 ─────────────────────── */
.scanlines {
  position: fixed; inset: 0; z-index: 40; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, .16) 0px, rgba(0, 0, 0, .16) 1px,
    transparent 1px, transparent 3px
  );
  opacity: .35;
}
.vignette {
  position: fixed; inset: 0; z-index: 41; pointer-events: none;
  background: radial-gradient(110% 90% at 50% 45%, transparent 60%, rgba(0, 0, 0, .5) 100%);
}

/* ── 终端窗口 ──────────────────────────────── */
.term {
  width: min(660px, 94vw);
  max-height: 92vh;
  background: var(--term);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, .6),
    0 24px 70px rgba(0, 0, 0, .65),
    0 0 46px rgba(70, 217, 138, .06);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.term-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, .025);
  border-bottom: 1px solid var(--border);
  font-size: 11.5px; color: var(--mut);
  user-select: none;
}
.term-bar .dots { display: flex; gap: 7px; margin-right: 6px; }
.term-bar .dots i { width: 10px; height: 10px; border-radius: 50%; opacity: .75; }
.term-bar .dots i:nth-child(1) { background: #ff5f56; }
.term-bar .dots i:nth-child(2) { background: #ffbd2e; }
.term-bar .dots i:nth-child(3) { background: #27c93f; }
.term-bar .session { letter-spacing: .04em; }
.term-bar .session b { color: var(--accent); font-weight: 600; }
.term-bar .spec { margin-left: auto; color: var(--dim); font-size: 10.5px; }

.term-body {
  padding: 20px 24px 18px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--dim) transparent;
}

/* ── 终端行 ────────────────────────────────── */
.line { white-space: pre-wrap; word-break: break-all; }
.prompt { color: var(--accent); text-shadow: 0 0 8px var(--glow); }
.cmd { color: var(--text); }
.comment { color: var(--dim); }
.ok { color: var(--accent); }
.caret {
  display: inline-block; width: .62em; height: 1.1em;
  background: var(--accent); vertical-align: -0.15em; margin-left: 2px;
  box-shadow: 0 0 8px var(--glow);
  animation: blink 1.06s steps(1) infinite;
}
@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

.gap { height: 14px; }
.gap-s { height: 6px; }

/* ── 曲目 ──────────────────────────────────── */
.track-line {
  font-size: 17px; font-weight: 700; color: #eef7f1;
  text-shadow: 0 0 16px rgba(70, 217, 138, .22);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-line .np { color: var(--accent); font-weight: 600; margin-right: 8px; }
.meta-line { color: var(--mut); font-size: 12.5px; }
.meta-line .k { color: var(--dim); }

/* ── 进度 ──────────────────────────────────── */
.progress-line {
  font-size: 13px; color: var(--mut);
  white-space: pre; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.progress-line .bar-fill { color: var(--accent); text-shadow: 0 0 6px var(--glow); }
.progress-line .bar-rest { color: var(--dim); }
.progress-line .t { color: var(--text); }

/* ── 歌词 ──────────────────────────────────── */
.lyrics { min-height: 108px; }
.l-cur {
  color: var(--accent-hi); font-weight: 600;
  text-shadow: 0 0 12px var(--glow);
}
.l-cur .gt { color: var(--accent); margin-right: 8px; }
.l-next { color: var(--mut); font-size: 12.5px; padding-left: 1.4em; }
.l-empty { color: var(--dim); font-style: italic; padding-left: 1.4em; }

/* ── 状态行 ────────────────────────────────── */
.status-line { font-size: 12.5px; color: var(--mut); }
.status-line .st { font-weight: 600; }
.st.playing { color: var(--accent); text-shadow: 0 0 8px var(--glow); }
.st.paused { color: var(--amber); }
.st.down { color: var(--red); animation: blink 1.2s steps(1) infinite; }

/* ── 行进入动画 ────────────────────────────── */
.line-in { animation: line-in .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes line-in {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ── 启幕（自动播放提示）────────────────────── */
.gate {
  position: fixed; inset: 0; z-index: 100; cursor: pointer;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.gate.hidden { display: none; }
.gate-box {
  width: min(560px, 92vw);
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--term);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .65), 0 0 46px rgba(70, 217, 138, .06);
  padding: 26px 28px;
  font-size: 14px;
}
.gate-box .press {
  margin-top: 16px; color: var(--amber); font-weight: 600; letter-spacing: .14em;
  animation: blink 1.3s steps(1) infinite;
}
.gate-box .hint { margin-top: 6px; color: var(--dim); font-size: 12px; }

@media (max-width: 560px) {
  body { font-size: 13px; }
  .term-body { padding: 16px 16px 14px; }
  .track-line { font-size: 15px; }
  .progress-line { font-size: 11.5px; }
  .term-bar .spec { display: none; }
}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="line"><span class="prompt">$</span> <span class="cmd">listen --join</span></div>
    <div class="line comment"># MusiCLI 一起听 · 实时同步主机的播放</div>
    <div class="press" id="gate-press">[ 按任意键 / 点击 接入音频流 ]</div>
    <div class="hint" id="gate-hint">浏览器需要用户交互才能播放音频</div>
  </div>
</div>

<div class="term">
  <div class="term-bar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="session"><b>musicli</b>@listen: ~/live</span>
    <span class="spec">UTF-8 · bash · 80×24</span>
  </div>
  <div class="term-body">
    <div class="line"><span class="prompt">$</span> <span class="cmd" id="type-cmd"></span><span class="caret" id="type-caret"></span></div>
    <div class="line comment" id="echo-comment" style="display:none"># 已接入主机音频流 · 只读模式（无法控制播放）</div>
    <div id="rest" style="display:none">
      <div class="gap"></div>
      <div class="line track-line" id="title-line"><span class="np">♪</span><span id="title">等待主办方播放…</span></div>
      <div class="line meta-line" id="meta"><span class="k">#</span> —</div>
      <div class="gap"></div>
      <div class="line progress-line" id="progress">[<span class="bar-rest">──────────────────────────</span>] <span class="t">0:00 / 0:00</span></div>
      <div class="gap"></div>
      <div class="lyrics" id="lyrics">
        <div class="l-empty"># 暂无歌词</div>
      </div>
      <div class="gap"></div>
      <div class="line status-line">
        <span class="prompt">$</span> <span class="cmd">status</span> <span class="comment">#</span>
        <span class="st" id="status-text">CONNECTING…</span><span class="caret"></span>
      </div>
    </div>
  </div>
</div>

<!--MUSICLI_JS-->
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  // ── 先绑定启幕层：即使播放器脚本加载失败也可关闭 ──
  var gate = $('#gate');
  var gateOff = false;
  var player = null;

  function dismissGate() {
    if (gateOff) return;
    gateOff = true;
    gate.classList.add('hidden');
    if (player) player.resume();
    boot();
  }
  gate.addEventListener('click', dismissGate);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;
    dismissGate();
  });

  if (typeof MusiCLIPlayer === 'undefined') {
    $('#gate-press').textContent = '[ 加载失败 ]';
    $('#gate-press').style.color = '#e06c75';
    $('#gate-hint').textContent = 'musicli.js 未就绪，请检查 HTTP 服务器';
    return;
  }

  // ── 开机动画：打字机（启幕关闭后执行）─────────
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    var cmd = 'listen --join --live';
    var el = $('#type-cmd');
    var i = 0;
    var timer = setInterval(function () {
      el.textContent = cmd.slice(0, ++i);
      if (i >= cmd.length) {
        clearInterval(timer);
        setTimeout(function () {
          $('#type-caret').style.display = 'none';
          $('#echo-comment').style.display = '';
          $('#rest').style.display = '';
          $('#echo-comment').classList.add('line-in');
          $('#rest').classList.add('line-in');
        }, 260);
      }
    }, 42);
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  var BAR_LEN = 26;
  function renderBar(pos, dur) {
    var pct = dur > 0 ? Math.min(1, pos / dur) : 0;
    var filled = Math.round(pct * BAR_LEN);
    var html = '[<span class="bar-fill">' + '█'.repeat(filled) + '</span>' +
      '<span class="bar-rest">' + '░'.repeat(BAR_LEN - filled) + '</span>] ' +
      '<span class="t">' + MusiCLIPlayer.formatTime(pos) + ' / ' + MusiCLIPlayer.formatTime(dur) + '</span>';
    $('#progress').innerHTML = html;
  }

  function renderLyrics() {
    var el = $('#lyrics');
    var lyrics = player.lyrics;
    var idx = player.currentLyricIndex;
    if (!lyrics.length) {
      el.innerHTML = '<div class="l-empty"># 纯音乐 / 暂无歌词</div>';
      return;
    }
    var html = '';
    if (idx >= 0 && idx < lyrics.length) {
      html += '<div class="l-cur line-in"><span class="gt">&gt;</span>' + escapeHtml(lyrics[idx].text) + '</div>';
      for (var i = 1; i <= 3; i++) {
        var ni = idx + i;
        if (ni < lyrics.length) {
          html += '<div class="l-next">' + escapeHtml(lyrics[ni].text) + '</div>';
        }
      }
    } else {
      html += '<div class="l-empty"># 前奏…</div>';
      for (var j = 0; j < Math.min(3, lyrics.length); j++) {
        html += '<div class="l-next">' + escapeHtml(lyrics[j].text) + '</div>';
      }
    }
    el.innerHTML = html;
  }

  function updateStatus() {
    var st = $('#status-text');
    st.className = 'st';
    if (!player.connected) {
      st.classList.add('down');
      st.textContent = 'RECONNECTING…';
    } else if (player.playing) {
      st.classList.add('playing');
      st.textContent = 'LIVE · 同步播放中';
    } else {
      st.classList.add('paused');
      st.textContent = 'PAUSED · 主机已暂停';
    }
  }

  player = new MusiCLIPlayer();

  player.on('track', function (track) {
    var title = track.title || '未知曲目';
    var artist = track.artist || '';
    var album = track.album || '';

    var line = $('#title-line');
    line.classList.remove('line-in');
    void line.offsetWidth;
    $('#title').textContent = title;
    line.classList.add('line-in');

    var meta = [];
    if (artist) meta.push(artist);
    if (album) meta.push(album);
    if (track.codec) meta.push(String(track.codec).toUpperCase());
    var m = $('#meta');
    m.innerHTML = '<span class="k">#</span> ' + escapeHtml(meta.join(' · ') || '未知艺术家');
    m.classList.remove('line-in');
    void m.offsetWidth;
    m.classList.add('line-in');

    renderBar(player.position, track.duration || player.duration);
    renderLyrics();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: album });
    }
    updateStatus();
  });

  player.on('state', function (s) {
    updateStatus();
  });

  player.on('tick', function (pos) {
    renderBar(pos, player.duration);
  });

  player.on('lyric', function () { renderLyrics(); });
  player.on('connect', updateStatus);
  player.on('disconnect', updateStatus);
  player.on('play', function () {
    gateOff = true;
    gate.classList.add('hidden');
    boot();
  });

  updateStatus();
  renderBar(0, 0);
  player.start();
})();
</script>
</body>
</html>
