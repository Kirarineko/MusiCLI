[package]
name = "musicli"
version = "3.5.2"
edition = "2021"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut", "dep:reqwest", "dep:mp3lame-encoder", "dep:windows-sys"]
asio = ["cpal/asio"]

[lib]
name = "musicli_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "musicli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio metadata
lofty = "0.21"

# Audio decoding
symphonia = { version = "0.6", features = [
    "mp3",
    "aac",
    "isomp4",
    "alac",
    "flac",
    "vorbis",
    "pcm",
    "wav",
] }

# Audio output (WASAPI default + ASIO optional)
cpal = "0.18"

# Lock-free ring buffer
rb = "0.4"

# Sample rate conversion
rubato = "0.16"

# ZIP
zip = "2"

# Utilities
walkdir = "2"
base64 = "0.22"
dirs = "5"
regex = "1"
chrono = "0.4"
sha2 = "0.10"

# Remote server client (GUI only — headless build must stay lean)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"], optional = true }

# MP3 encoding (bundled LAME) — shrinks audio attachments for LLM tagging (GUI only)
mp3lame-encoder = { version = "0.2", optional = true }

# Windows: real system-level mouse click to establish WebView2 keyboard focus
# after the global hotkey activates the window (synthetic DOM focus is refused)
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
], optional = true }

# Headless / server mode
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
